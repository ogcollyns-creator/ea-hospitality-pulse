name: Build & publish site

on:
  push:
    branches: [main]
    paths:
      - 'editions-src/**.md'
      - 'guides-src/**.md'
      - 'site_config.json'
      # image pipeline: a guardrail change must be able to trigger a rebuild,
      # otherwise a fix to the age/no-reuse rules sits unapplied until the next
      # edition happens to be published.
      - 'build_site.py'
      - 'hero_extra.py'
      - 'fetch_edition_images.py'
      - 'fetch_images.py'
      - 'make_og_images.py'
      - 'img/edition-credits.json'
  workflow_dispatch:

concurrency:
  group: build-site
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: pip install --quiet Pillow numpy

      - name: Pre-publish quality gate (auto-fix + block)
        run: |
          python3 radar/prepublish_gate.py --changed --fix --strict
          # if the gate auto-repaired an edition, commit the fix before building
          git config user.email 'ogcollyns@gmail.com'
          git config user.name 'EA Hospitality Pulse'
          git add -A editions-src
          git diff --staged --quiet || git commit -m "Gate auto-fix: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:main || true

      - name: Fetch photo pool (best-effort; expands clean-image variety)
        run: python3 fetch_images.py || echo "image fetch skipped (network); using photos already in img/"

      - name: Assign vetted press-kit images (best-effort; before the Wikimedia fetch)
        run: python3 hero_extra.py --press-kit || echo "press-kit pass skipped"

      - name: Assign a unique photo per edition (best-effort; Commons + attribution)
        run: python3 fetch_edition_images.py || echo "per-edition image fetch skipped (network); editions fall back to the curated pool"

      - name: Generate AI illustration for any edition still without a hero (best-effort)
        env:
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
        run: python3 hero_extra.py --ai-fallback || echo "ai-fallback pass skipped"

      - name: Build site
        run: python3 build_site.py

      - name: Commit generated output
        run: |
          git config user.email 'ogcollyns@gmail.com'
          git config user.name 'EA Hospitality Pulse'
          git add -A data.js index.html sitemap.xml feed.xml ledger.js guides.js og img editions guides
          git diff --staged --quiet || git commit -m "Auto-build: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:main
