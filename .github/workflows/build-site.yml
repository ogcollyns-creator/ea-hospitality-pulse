name: Build & publish site

on:
  push:
    branches: [main]
    paths:
      - 'editions-src/**.md'
      - 'guides-src/**.md'
      - 'site_config.json'
      # image pipeline: a guardrail change must be able to trigger a rebuild,
      # otherwise a fix to the age/no-reuse rules sits unapplied until the next
      # edition happens to be published.
      - 'build_site.py'
      - 'hero_extra.py'
      - 'make_og_images.py'
      - 'hero_extra.py'
      - 'image_sources.py'
      - 'img/edition-credits.json'
      - 'img/editorial-picks.json'
      # hand-supplied heroes (2 Oct 2026). A dropped hero, a repointed hero_map
      # and a change to the gate itself must each be able to trigger a rebuild;
      # og/hero_map.json was NOT listed before, so repointing a hero did nothing
      # until something else on this list happened to move.
      - 'hero_gate.py'
      - 'og/hero_map.json'
      - 'img/incoming/**'
      # the workflow itself: a change to the gate or the hero chain must be able
      # to trigger a rebuild, or the fix sits undeployed until something else moves
      - '.github/workflows/build-site.yml'
  workflow_dispatch:

concurrency:
  group: build-site
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: pip install --quiet Pillow numpy

      - name: Pre-publish quality gate (auto-fix + block)
        run: |
          # A manual run regenerates assets for already-published editions, so the
          # editorial sweep gate is advisory there. A push carries new editorial
          # content and keeps the full gate.
          GATE_ARGS="--changed --fix --strict"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            GATE_ARGS="$GATE_ARGS --assets-only"
          elif ! git diff --name-only HEAD~1 HEAD -- editions-src | grep -q .; then
            # No editorial content in this push -- it is code, CSS or images. There
            # is no new claim for the source sweep to protect, and blocking here
            # freezes the whole site: runs #99-#104 all failed this way, so six
            # commits' worth of fixes sat undeployed while the site served stale HTML.
            echo "no editions-src changes in this push — asset-only gate"
            GATE_ARGS="$GATE_ARGS --assets-only"
          fi
          echo "gate: $GATE_ARGS"
          python3 radar/prepublish_gate.py $GATE_ARGS
          # if the gate auto-repaired an edition, commit the fix before building
          git config user.email 'ogcollyns@gmail.com'
          git config user.name 'EA Hospitality Pulse'
          git add -A editions-src
          git diff --staged --quiet || git commit -m "Gate auto-fix: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:main || true
      # HEROES ARE HAND-SUPPLIED (editor decision, 2 Oct 2026).
      #
      # What was here: a press-kit pass, a pool-widening fetch, a scored photo
      # search against Wikimedia/Openverse, and a data-card fallback. The search
      # is retired. It was not failing on licensing -- 87 of 122 heroes it chose
      # carry a verified CC licence -- it was failing on RELEVANCE, because ten of
      # its nineteen scoring topics are places rather than subjects, and because
      # no reusable photograph of "a cash reserve requirement hike" exists to be
      # found. It returned "Paje beach at low tide" for a levy brief.
      #
      # The editor now supplies every hero. Intake routes a dropped file to the
      # right place; the gate refuses to build an in-scope item that has none.
      - name: File supplied heroes from img/incoming/
        run: |
          python3 hero_gate.py --intake
          git config user.email 'ogcollyns@gmail.com'
          git config user.name 'EA Hospitality Pulse'
          git add -A og img guides-src
          git diff --staged --quiet || git commit -m "Hero intake: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:main || true

      # Everything before 2 Oct 2026 is grandfathered inside hero_gate (CUTOFF),
      # so this is green on the day it ships and only ever blocks a NEW edition or
      # Big Read that arrived without a hero. For the back catalogue run
      # `python3 hero_gate.py --check --since 0000-00-00`.
      - name: Hero required - block the build if one is missing
        run: python3 hero_gate.py --check --strict

      - name: Build site
        run: python3 build_site.py

      - name: Commit generated output
        run: |
          git config user.email 'ogcollyns@gmail.com'
          git config user.name 'EA Hospitality Pulse'
          git add -A data.js index.html sitemap.xml feed.xml ledger.js guides.js og img editions guides
          git diff --staged --quiet || git commit -m "Auto-build: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:main
