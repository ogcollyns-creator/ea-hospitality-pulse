name: Build & publish site

on:
  push:
    branches: [main]
    paths:
      - 'editions-src/**.md'
      - 'guides-src/**.md'
      - 'site_config.json'
      # image pipeline: a guardrail change must be able to trigger a rebuild,
      # otherwise a fix to the age/no-reuse rules sits unapplied until the next
      # edition happens to be published.
      - 'build_site.py'
      - 'hero_extra.py'
      - 'make_og_images.py'
      - 'hero_extra.py'
      - 'assign_edition_photos.py'
      - 'image_sources.py'
      - 'img/edition-credits.json'
      - 'img/editorial-picks.json'
      # the workflow itself: a change to the gate or the hero chain must be able
      # to trigger a rebuild, or the fix sits undeployed until something else moves
      - '.github/workflows/build-site.yml'
  workflow_dispatch:

concurrency:
  group: build-site
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: pip install --quiet Pillow numpy

      - name: Pre-publish quality gate (auto-fix + block)
        run: |
          # A manual run regenerates assets for already-published editions, so the
          # editorial sweep gate is advisory there. A push carries new editorial
          # content and keeps the full gate.
          GATE_ARGS="--changed --fix --strict"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            GATE_ARGS="$GATE_ARGS --assets-only"
          elif ! git diff --name-only HEAD~1 HEAD -- editions-src | grep -q .; then
            # No editorial content in this push -- it is code, CSS or images. There
            # is no new claim for the source sweep to protect, and blocking here
            # freezes the whole site: runs #99-#104 all failed this way, so six
            # commits' worth of fixes sat undeployed while the site served stale HTML.
            echo "no editions-src changes in this push — asset-only gate"
            GATE_ARGS="$GATE_ARGS --assets-only"
          fi
          echo "gate: $GATE_ARGS"
          python3 radar/prepublish_gate.py $GATE_ARGS
          # if the gate auto-repaired an edition, commit the fix before building
          git config user.email 'ogcollyns@gmail.com'
          git config user.name 'EA Hospitality Pulse'
          git add -A editions-src
          git diff --staged --quiet || git commit -m "Gate auto-fix: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:main || true
      - name: Assign vetted press-kit images (best-effort; before the Wikimedia fetch)
        run: python3 hero_extra.py --press-kit || echo "press-kit pass skipped"

      - name: Hero — real photography where the edition has a visual subject
        env:
          GOOGLE_CSE_KEY: ${{ secrets.GOOGLE_CSE_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
        run: python3 assign_edition_photos.py --replace-cards --limit 30 || echo "photo pass skipped"

      - name: Hero — AI image where no photograph fits (photorealistic, disclosed)
        env:
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
          IMAGE_API_URL: ${{ secrets.IMAGE_API_URL }}
          IMAGE_API_MODEL: ${{ secrets.IMAGE_API_MODEL }}
        run: |
          # Preflight is informational: it prints WHY generation is or is not
          # working (never the key) so a silent failure cannot hide again.
          python3 hero_extra.py --check-image-api || true
          python3 hero_extra.py --ai-fallback --replace-cards || echo "ai-fallback pass skipped"

      - name: Hero — licensed destination photo where no subject fits
        run: python3 assign_edition_photos.py --replace-cards --destination-fallback --limit 40 || echo "destination pass skipped"

      - name: Hero — data card (last resort, and for any news-event edition)
        run: python3 hero_extra.py --data-card || echo "data-card pass skipped"

      - name: Build site
        run: python3 build_site.py

      - name: Commit generated output
        run: |
          git config user.email 'ogcollyns@gmail.com'
          git config user.name 'EA Hospitality Pulse'
          git add -A data.js index.html sitemap.xml feed.xml ledger.js guides.js og img editions guides
          git diff --staged --quiet || git commit -m "Auto-build: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:main
