name: Build & publish site

on:
  push:
    branches: [main]
    paths:
      - 'editions-src/**.md'
      - 'guides-src/**.md'
      - 'site_config.json'
  workflow_dispatch:

concurrency:
  group: build-site
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: pip install --quiet Pillow numpy

      - name: Build site
        run: python3 build_site.py

      - name: Commit generated output
        run: |
          git config user.email 'ogcollyns@gmail.com'
          git config user.name 'EA Hospitality Pulse'
          git add -A data.js index.html sitemap.xml feed.xml ledger.js guides.js og editions guides
          git diff --staged --quiet || git commit -m "Auto-build: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:main || echo "nothing to push"
