name: Post edition to Telegram

# DELIVERY ONLY — this workflow does not decide whether an edition is fit to
# publish. That judgement belongs to radar/prepublish_gate.py, which now runs in
# the authoring task BEFORE the edition is written and committed (see
# sweep/README.md, "Where the gate runs").
#
# Why it moved: the gate ran here as a blocking first step, and its Primary
# Source Sweep check requires sweep_state.json to have been refreshed the same
# day. When the sweep went stale on 31 Aug 2026 the gate failed on every push,
# the job died before Python was installed, and six editions (1, 3, 4 and 5 Sep)
# reached the website but never reached Telegram — silently, because a failed
# delivery job looks the same as a quiet news day from inside the channel.
#
# A gate that stops bad writing is a control. A gate that stops good writing
# being delivered, after it has already shipped to the web, is an outage. The
# check still runs below, but as a report: it annotates the run, never blocks.

on:
  push:
    branches: [main]
    paths:
      - 'editions-src/**.md'
  workflow_dispatch:
    inputs:
      files:
        description: >-
          Catch-up list: space- or comma-separated edition names, oldest first
          (e.g. "pulse-2026-09-01-morning pulse-2026-09-01-evening").
          Leave blank to post the most recently committed edition.
        required: false
        default: ''
      gap_seconds:
        description: 'Seconds between editions on a multi-edition catch-up run.'
        required: false
        default: '45'

concurrency:
  group: telegram-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Non-blocking. Surfaces sweep staleness and edition-quality warnings in
      # the run log without holding up delivery of an edition that is already
      # committed and live on the website.
      - name: Pre-publish quality report (non-blocking)
        continue-on-error: true
        run: |
          python3 radar/prepublish_gate.py --changed \
            || echo "::warning::pre-publish gate reported issues (see above). Delivery continues; fix these at authoring time, not here."

      - name: Install image dependencies
        run: pip install --quiet Pillow numpy

      - name: Assign vetted press-kit images (best-effort; before the Wikimedia fetch)
        run: python3 hero_extra.py --press-kit || echo "press-kit pass skipped"

      - name: Hero — data card (default; a brief's hero is its number, not scenery)
        run: python3 hero_extra.py --data-card || echo "data-card pass skipped"

        # Reuses the site's Wikimedia image + attribution so Telegram carries the
        # same licence-clear picture and credit as the web edition. Best-effort:
        # if this is skipped (network) the edition still posts text-only.
      - name: AI illustration fallback so a new edition always has a hero (best-effort)
        env:
          IMAGE_API_KEY: ${{ secrets.IMAGE_API_KEY }}
        run: python3 hero_extra.py --ai-fallback || echo "ai-fallback pass skipped"

      - name: Post newly added editions
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: '@eahospitalitypulse'
          TG_FILES: ${{ github.event.inputs.files }}
          TG_GAP_SECONDS: ${{ github.event.inputs.gap_seconds }}
        run: python3 .github/scripts/post_telegram.py
