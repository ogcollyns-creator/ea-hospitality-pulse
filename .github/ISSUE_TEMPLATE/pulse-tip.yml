name: Pulse story tip
description: Flag something that should go into an upcoming Morning/Midday/Evening/Sunday edition.
title: "[Tip] "
labels: ["pulse-tip"]
body:
  - type: markdown
    attributes:
      value: |
        This is for a **story tip**, not a finished edition — the daily Pulse has its own strict internal format and posts straight to Telegram/WhatsApp/LinkedIn, so tips get folded in by the editor rather than published directly. If you want to write a full standalone piece under your own name instead, see [CONTRIBUTING.md](../../CONTRIBUTING.md) for the guest guide path.
  - type: input
    id: headline
    attributes:
      label: What happened
      description: One line — the fact, not your opinion of it.
      placeholder: "EPRA raises Kenya diesel price ceiling for August"
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: A link to the official notice, report or article. No source, no tip — this is what gets verified before it runs.
      placeholder: "https://www.epra.go.ke/..."
    validations:
      required: true
  - type: input
    id: date
    attributes:
      label: Date it happened / was published
      placeholder: "2026-08-01"
    validations:
      required: true
  - type: checkboxes
    id: markets
    attributes:
      label: Markets affected
      options:
        - label: Kenya
        - label: Uganda
        - label: Tanzania
        - label: Zanzibar
        - label: Rwanda
        - label: Region-wide
  - type: checkboxes
    id: segment
    attributes:
      label: Segment affected
      options:
        - label: City
        - label: Bush
        - label: Beach
  - type: textarea
    id: sowhat
    attributes:
      label: Why it matters for an owner or operator
      description: The "so what" — what should someone reading this actually do about it?
      placeholder: "Transfer and excursion costs move with diesel — re-quote 2027 transfer-inclusive packages rather than eating the margin."
    validations:
      required: true
  - type: dropdown
    id: confidence
    attributes:
      label: How confident are you in this?
      options:
        - Confirmed — official source, verified
        - Reported — credible press, not yet officially confirmed
        - Early signal — worth watching, not yet solid enough to publish alone
    validations:
      required: true
